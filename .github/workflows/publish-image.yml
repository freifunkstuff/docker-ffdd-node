name: Publish Docker Image

on:
  push:
    branches:
      - master
      - "**"
    tags:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_REF_TYPE=${{ github.ref_type }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          tags: ghcr.io/${{ github.repository_owner }}/ffdd-node:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ffdd-node:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ffdd-node:buildcache,mode=max

      - name: Verify fastd descriptor cleanup in published image
        timeout-minutes: 10
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ffdd-node@${{ steps.image.outputs.digest }}
          CACHE: ghcr.io/${{ github.repository_owner }}/ffdd-node:buildcache
        run: |
          docker buildx build --target builder --load --cache-from "type=registry,ref=$CACHE" -t ffdd-node-test-builder .
          docker pull "$IMAGE"
          python3 tests/integration_fastd_fd_close.py --image ffdd-node-test-builder
          python3 tests/integration_fastd_image.py --image "$IMAGE" --builder ffdd-node-test-builder
