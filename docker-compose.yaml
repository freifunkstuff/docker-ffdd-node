services:
  dockernode:
    container_name: ffdd-node
    build:
      context: .
      dockerfile: Dockerfile
    image: ffdd-node
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./data:/data
    mem_limit: 200m
    stop_grace_period: 15s
    environment:
      NODE_CONTACT_EMAIL: ${NODE_CONTACT_EMAIL:-}
      NODE_NAME: ${NODE_NAME:-}
      NODE_CONTACT_NAME: ${NODE_CONTACT_NAME:-}
      NODE_CONTACT_LOCATION: ${NODE_CONTACT_LOCATION:-}
      NODE_CONTACT_NOTE: ${NODE_CONTACT_NOTE:-}
      NODE_COMMUNITY: ${NODE_COMMUNITY:-Dresden}
      NODE_GPS_LATITUDE: ${NODE_GPS_LATITUDE:-}
      NODE_GPS_LONGITUDE: ${NODE_GPS_LONGITUDE:-}
      NODE_GPS_ALTITUDE: ${NODE_GPS_ALTITUDE:-0}
      FASTD_PORT: ${FASTD_PORT:-5002}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-}
      REGISTRAR_INTERVAL: ${REGISTRAR_INTERVAL:-3600}
      NODE_REGISTRATION_MODE: ${NODE_REGISTRATION_MODE:-registered}
      NODE_TYPE: ${NODE_TYPE:-server}
      NODE_EXPECTED_ID: ${NODE_EXPECTED_ID:-0}
      SYSINFO_BOARD: ${SYSINFO_BOARD:-docker}
      SYSINFO_MODEL: ${SYSINFO_MODEL:-docker-alpine}
      SYSINFO_MODEL2: ${SYSINFO_MODEL2:-}
      BACKBONE_ENABLED: ${BACKBONE_ENABLED:-1}
      BACKBONE_PEERS: ${BACKBONE_PEERS:-}
      NODE_REGISTRATION_URL: ${NODE_REGISTRATION_URL:-}
      NODE_REGISTRATION_CA_FILE: ${NODE_REGISTRATION_CA_FILE:-}
      BMXD_PREFERRED_GATEWAY: ${BMXD_PREFERRED_GATEWAY:-}
      BMXD_ONLY_COMMUNITY_GATEWAYS: ${BMXD_ONLY_COMMUNITY_GATEWAYS:-true}
      MESH_INTERFACES: ${MESH_INTERFACES:-}
      LAN_MESH_ACCESS_ENABLED: ${LAN_MESH_ACCESS_ENABLED:-false}
      LAN_MESH_ACCESS_SOURCES: ${LAN_MESH_ACCESS_SOURCES:-}